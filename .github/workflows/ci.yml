name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Package contents
        run: npm pack --dry-run
      - name: Smoke-test the built stdio binary
        run: |
          (printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'; sleep 3) \
            | timeout 20 node dist/stdio.js > out.jsonl || true
          grep -q '"summarize_test_failures"' out.jsonl

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t devpilot-mcp .
      - name: Boot and check /healthz
        run: |
          docker run -d --name devpilot -p 3000:3000 \
            -e ALLOWED_REPOS=Ashbruh22/devpilot-demo@main -e INSTALL_DEPS=false devpilot-mcp
          for i in $(seq 1 30); do curl -fsS localhost:3000/healthz && exit 0; sleep 1; done
          docker logs devpilot; exit 1
